name: xue_hua_media_compression
description: "Flutter plugin for image and video compression using platform encoders."
version: 2.3.2
homepage: https://github.com/Matkurban/xue_hua_media_compression
repository: https://github.com/Matkurban/xue_hua_media_compression
issue_tracker: https://github.com/Matkurban/xue_hua_media_compression/issues
documentation: https://github.com/Matkurban/xue_hua_media_compression/blob/main/README.md

topics:
  - compression
  - image
  - video
  - plugin

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.3
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: com.xuehua.xue_hua_media_compression
        pluginClass: XueHuaMediaCompressionPlugin
      ios:
        pluginClass: XueHuaMediaCompressionPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: XueHuaMediaCompressionPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: XueHuaMediaCompressionWindowsPluginCApi
      linux:
        pluginClass: XueHuaMediaCompressionLinuxPlugin
